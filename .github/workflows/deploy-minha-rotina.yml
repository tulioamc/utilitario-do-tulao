name: Deploy Minha Rotina
on:
  push:
    branches: [main]
    paths:
      - 'minha-rotina/**'
      - '.github/workflows/deploy-minha-rotina.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: minha-rotina-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: ./minha-rotina
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
